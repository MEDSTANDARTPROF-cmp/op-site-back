version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obrprofi-web
    ports:
      - "8080:80"
    volumes:
      - ../site:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - db
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    networks:
      - obrprofi

  db:
    image: mysql:5.7
    container_name: obrprofi-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: obrprofi
      MYSQL_USER: obrprofi
      MYSQL_PASSWORD: obrprofi
    volumes:
      - db_data:/var/lib/mysql
      - ../backup/obrprofi_db_dump.sql:/docker-entrypoint-initdb.d/dump.sql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci --max_allowed_packet=256M
    networks:
      - obrprofi

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: obrprofi-pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    networks:
      - obrprofi

volumes:
  db_data:

networks:
  obrprofi:
